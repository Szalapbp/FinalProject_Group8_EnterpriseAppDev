<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cart — UC Collectibles</title>
    <link rel="stylesheet" th:href="@{/styles.css}"/>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="cart-wrap">
    <h1 class="cart-title">Your Cart
        <span class="cart-count"
              th:if="${totalItems > 0}"
              th:text="'(' + ${totalItems} + ' items)'"></span>
    </h1>

    <!-- Populated cart -->
    <div th:if="${items != null and !items.isEmpty()}">
        <table class="cart-table">
            <thead>
            <tr>
                <th colspan="2">Product</th>
                <th>Size</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Subtotal</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td class="item-img-cell">
                    <img class="item-img"
                         th:if="${item.product.images != null and !item.product.images.isEmpty()}"
                         th:src="${item.product.images[0]}"
                         th:alt="${item.product.name}"/>
                    <div class="item-img item-img-placeholder"
                         th:unless="${item.product.images != null and !item.product.images.isEmpty()}">🐻</div>
                </td>
                <td>
                    <div class="item-name" th:text="${item.product.name}">Product</div>
                    <div class="item-meta" th:text="${item.product.category}">Category</div>
                </td>
                <td th:text="${item.size}">M</td>
                <td th:text="'$' + ${#numbers.formatDecimal(item.product.price, 1, 2)}">$0.00</td>
                <td>
                    <form th:action="@{/cart/items/{id}(id=${item.id})}" method="post" class="qty-form">
                        <input type="hidden" name="_method" value="PUT"/>
                        <input type="number" name="quantity" class="qty-input"
                               th:value="${item.quantity}" min="0" max="99"/>
                        <button type="submit" class="btn-update">↻ Update</button>
                    </form>
                </td>
                <td th:text="'$' + ${#numbers.formatDecimal(item.product.price.multiply(T(java.math.BigDecimal).valueOf(item.quantity.longValue())), 1, 2)}">$0.00</td>
                <td>
                    <form th:action="@{/cart/items/{id}(id=${item.id})}" method="post">
                        <input type="hidden" name="_method" value="DELETE"/>
                        <button type="submit" class="btn-remove" title="Remove">×</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="cart-footer">
            <div class="cart-total">
                Total: <span class="cart-total-price"
                             th:text="'$' + ${#numbers.formatDecimal(totalPrice, 1, 2)}">$0.00</span>
            </div>
            <div class="cart-actions">
                <form th:action="@{/cart/clear}" method="post">
                    <input type="hidden" name="_method" value="DELETE"/>
                    <button type="submit" class="btn-clear">Clear Cart</button>
                </form>
                <button class="btn-checkout" disabled>Checkout</button>
            </div>
        </div>
    </div>

    <!-- Empty cart -->
    <div class="empty-cart" th:if="${items == null or items.isEmpty()}">
        <p>Your cart is empty.</p>
        <p><a th:href="@{/products}">Browse products →</a></p>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
